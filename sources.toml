# AllBlock – Quellen-Konfiguration
#
# Jede Kategorie bekommt:
#   lists/<kategorie>/<id>.txt      -> jede einzelne Quelle (normalisiert, nur Domains)
#   combined/<kategorie>.txt         -> alle Quellen der Kategorie zusammengefasst (Domains)
#   combined/<kategorie>.adblock.txt -> dasselbe im AdGuard-Format (||domain^)
#
# Unterstützte Eingabeformate werden automatisch erkannt:
#   hosts (0.0.0.0 domain), reine Domainlisten, Adblock (||domain^), Wildcards (*.domain), URLs.
#
# Neue Quelle hinzufügen: einfach einen [[categories.<kategorie>.sources]]-Block ergänzen.

# --------------------------------------------------------------------------- #
