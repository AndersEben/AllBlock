name: Build blocklists

on:
  schedule:
    - cron: "17 3,15 * * *" # 2x täglich
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.toml
      - allowlist.txt
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Vorherige Listen holen – dienen als Fallback, falls eine Quelle ausfällt
      - name: Checkout previous lists
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: lists
          path: public

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python scripts/build.py --out public --repo "${{ github.repository }}" --branch lists

      # Listen auf einem verwaisten Branch ohne Historie veröffentlichen,
      # damit das Repository nicht mit jeder Aktualisierung um hunderte MB wächst.
      - name: Publish to lists branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          rm -rf .git
          git init -q -b lists
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update lists $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" lists
