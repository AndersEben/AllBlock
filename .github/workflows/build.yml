name: Build blocklists

on:
  schedule:
    - cron: "17 3,15 * * *" # 2x täglich
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.toml
      - allowlist.txt
      - scripts/**
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-lists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Die bereits eingecheckten Listen dienen als Fallback, falls eine Quelle ausfällt.
      - name: Build
        run: python scripts/build.py --out . --repo "${{ github.repository }}" --branch main

      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A combined lists stats.json STATUS.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -q -m "Update lists $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
